version: '3.8'
services:
    app:
        build:
            context: .
            dockerfile: dockerfile
        container_name: nestjs-app
        restart: unless-stopped
        ports:
            - '3000:3000'
        environment:
            - NODE_ENV=production
            - APP_NAME=${APP_NAME}
            - POSTGRES_USER=${POSTGRES_USER}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            - POSTGRES_DB=${POSTGRES_DB}
            - POSTGRES_HOST=postgree
            - POSTGRES_PORT=5432
            - JWT_SECRET=${JWT_SECRET}
            - REDIS_HOST=${REDIS_HOST}
            - REDIS_PORT=${REDIS_PORT}
            - TWO_FACTOR_SECRET_KEY=${TWO_FACTOR_SECRET_KEY}
            - PEPPER_SECRET=${PEPPER_SECRET}
            - LOG_LEVEL=info
        depends_on:
            - postgree
            - redis
        networks:
            - app-network
        # deploy:
        #     resources:
        #         limits:
        #             cpu: '1'
        #             memory: 512M
        #         reservation:
        #             cpus: '0.5'
        #             memory: 256M

    postgree:
        image: postgres:latest
        container_name: postgree
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}
        ports:
            - '${POSTGRES_PORT}:5432'
        networks:
            - app-network
        # healthcheck:
        #     test: ["CMD-SHELL", "pg_isready -U postgres"]
        #     interval: 10s
        #     timeout: 5s
        #     retries: 5

    redis:
        image: redis:7-alpine
        container_name: redis
        ports:
            - '${REDIS_PORT}:6379'
        networks:
            - app-network

# volumes:
#     postgres_data:

networks:
    app-network:
        driver: bridge
